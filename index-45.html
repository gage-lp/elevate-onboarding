<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elevate Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F4ED; --ink:#0A0A0A; --blue:#0066ff; --muted:#6B6B66;
  --line:#E2DDD2; --card:#FFFFFF; --locked:#B8B2A4; --ok:#1F7A4D;
  --radius:4px;
  --display:'Playfair Display',Georgia,serif; --body:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;background:var(--ink);color:var(--paper)}
.topbar .brand{font-family:var(--display);font-size:20px}
.topbar .brand b{color:var(--blue)}
.topbar .who{font-family:var(--mono);font-size:12px;color:#C9C4B8}
.topbar .right{display:flex;align-items:center;gap:16px}
.topbar button{background:none;border:1px solid #3a3a3a;color:var(--paper);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;border-radius:var(--radius);cursor:pointer}
.topbar button:hover{border-color:var(--blue);color:var(--blue)}
.wrap{max-width:820px;margin:0 auto;padding:40px 24px 80px}
.page-head{margin-bottom:32px}
.page-head h1{font-size:38px;margin:6px 0 4px}
.page-head p{color:var(--muted);max-width:54ch}
.meter{margin-top:22px}
.meter-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.meter-fill{height:100%;background:var(--blue);width:0;transition:width .5s ease}
.meter .label{display:block;margin-bottom:8px}
.modules{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.module{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;text-align:left;width:100%;cursor:pointer;font-family:var(--body);transition:border-color .15s,transform .15s}
.module:hover:not(.is-locked){border-color:var(--blue);transform:translateY(-1px)}
.module .idx{font-family:var(--mono);font-size:20px;color:var(--blue)}
.module .m-title{font-family:var(--display);font-size:19px}
.module .m-sub{font-size:13px;color:var(--muted);margin-top:2px}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:99px;white-space:nowrap}
.pill.available{background:#EAF1FF;color:var(--blue)}
.pill.complete{background:#E6F3EC;color:var(--ok)}
.pill.submitted{background:#FBF0DC;color:#9A6B00}
.pill.locked{background:#EFECE3;color:var(--locked)}
.module.is-locked{cursor:not-allowed;opacity:.6}
.module.is-locked .idx{color:var(--locked)}
/* full-page module view */
.mod-page .embed{width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;background:#000}
.mod-page iframe.cal{width:100%;height:600px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:18px}
.mod-page .body-html{color:#3a3a36;margin-bottom:22px}
.mod-page .complete-zone{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.back{font-family:var(--mono)!important}
/* overlay (admin editor) */
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.55);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
.overlay.open{display:flex}
.sheet{background:var(--paper);border-radius:var(--radius);max-width:660px;width:100%;max-height:90vh;overflow-y:auto;padding:32px}
.sheet .label{margin-bottom:6px}
.sheet h2{font-size:26px;margin-bottom:10px}
.field{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius);font-family:var(--mono);font-size:14px;background:var(--card);margin-bottom:16px}
.field:focus{outline:none;border-color:var(--blue)}
textarea.field{min-height:90px;font-family:var(--body);resize:vertical}
select.field{cursor:pointer}
.flabel{display:block;margin-bottom:6px;margin-top:4px}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:13px 20px;border-radius:var(--radius);border:none;cursor:pointer;background:var(--blue);color:#fff;transition:opacity .15s;text-decoration:none;display:inline-block}
.btn:hover{opacity:.88}
.btn[disabled]{background:var(--locked);cursor:not-allowed}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:none;color:#B3261E;border:1px solid #E7C9C6}
.btn.sm{padding:7px 12px;font-size:11px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.note{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
.err{color:#B3261E;font-size:13px;margin-top:10px;min-height:18px}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:40px 36px;max-width:380px;width:100%}
.login-card .brand{font-family:var(--display);font-size:26px;margin-bottom:4px}
.login-card .brand b{color:var(--blue)}
.login-card .sub{color:var(--muted);font-size:14px;margin-bottom:26px}
.tabs{display:flex;gap:8px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:12px 16px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer}
.tab.active{color:var(--ink);border-bottom-color:var(--blue)}
.mod-row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px}
.mod-row .idx{font-family:var(--mono);color:var(--blue);font-size:16px}
.mod-row .t{font-family:var(--display);font-size:17px}
.mod-row .s{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.mod-row .ctrls{display:flex;gap:6px;align-items:center}
.icon-btn{font-family:var(--mono);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);width:30px;height:30px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{border-color:var(--blue);color:var(--blue)}
.icon-btn[disabled]{opacity:.4;cursor:not-allowed}
.agent-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px}
.agent-card .head{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.agent-card .name{font-family:var(--display);font-size:18px}
.agent-card .email{font-family:var(--mono);font-size:12px;color:var(--muted)}
.agent-prog{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;display:none}
.agent-prog.open{display:block}
.prog-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F0EDE4;gap:12px}
.prog-line:last-child{border-bottom:none}
.prog-line .pl-title{font-size:14px}
.link-row .field{margin:0}
@media (max-width:520px){.module{grid-template-columns:36px 1fr}.module .pill{grid-column:2;justify-self:start;margin-top:6px}.page-head h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="view-login" style="display:none">
  <div class="login-wrap"><div class="login-card">
    <div class="brand">Elevate<b>.</b></div>
    <div class="sub">Agent onboarding</div>
    <label class="label flabel" for="email">Email</label>
    <input class="field" id="email" type="email" autocomplete="email" />
    <label class="label flabel" for="password">Password</label>
    <input class="field" id="password" type="password" autocomplete="current-password" />
    <button class="btn" id="signin" style="width:100%">Sign in</button>
    <div class="err" id="login-err"></div>
  </div></div>
</section>

<section id="view-agent" style="display:none">
  <div class="topbar">
    <div class="brand">Elevate<b>.</b></div>
    <div class="right"><span class="who" id="agent-who"></span><button class="signout">Sign out</button></div>
  </div>
  <div class="wrap">
    <div class="page-head">
      <span class="label">Your onboarding</span>
      <h1 id="greeting">Welcome.</h1>
      <p>Work through each step in order. Finish one to unlock the next.</p>
      <div class="meter"><span class="label" id="meter-label">0 of 0 complete</span><div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div></div>
    </div>
    <div class="modules" id="agent-modules"></div>
  </div>
</section>

<section id="view-module" style="display:none">
  <div class="topbar">
    <div class="brand">Elevate<b>.</b></div>
    <div class="right"><button class="back" id="module-back">&larr; Back to onboarding</button></div>
  </div>
  <div class="wrap mod-page" id="module-body"></div>
</section>

<section id="view-admin" style="display:none">
  <div class="topbar">
    <div class="brand">Elevate<b>.</b> <span style="font-family:var(--mono);font-size:11px;color:#C9C4B8;letter-spacing:.1em">ADMIN</span></div>
    <div class="right"><span class="who" id="admin-who"></span><button class="signout">Sign out</button></div>
  </div>
  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-tab="modules">Modules</button>
      <button class="tab" data-tab="agents">Agent progress</button>
    </div>
    <div id="tab-modules">
      <div class="row" style="justify-content:space-between;margin-bottom:18px">
        <span class="label">Onboarding modules &middot; in order</span>
        <button class="btn sm" id="new-module">+ New module</button>
      </div>
      <div id="admin-modules"></div>
    </div>
    <div id="tab-agents" style="display:none">
      <span class="label" style="display:block;margin-bottom:14px">Agents &amp; their progress</span>
      <div id="admin-agents"></div>
    </div>
  </div>
</section>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qgvrdlokbgavsgqpvway.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFndnJkbG9rYmdhdnNncXB2d2F5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MjAxNTEsImV4cCI6MjA5NzE5NjE1MX0.MreqXyB9eNeAsPuuKbs6nn1KHiLHBTfbqdc7GEUmg9k";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let ME=null;

function show(v){["login","agent","module","admin"].forEach(x=>document.getElementById("view-"+x).style.display=(x===v?"block":"none"));}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function closeSheet(){document.getElementById("overlay").classList.remove("open");}
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeSheet();});
document.querySelectorAll(".signout").forEach(b=>b.addEventListener("click",async()=>{await sb.auth.signOut();route();}));
function typeLabel(t){return{video:"Video",link_submission:"Submit a link",scheduler:"Book a session",datetime:"Pick a date & time",acknowledgment:"Acknowledge",file_upload:"Upload a file",embedded_academy:"Academy course",mark_complete:"Task"}[t]||t;}
function statusText(s){return{available:"Start",complete:"Done",submitted:"Awaiting coach",locked:"Locked"}[s]||s;}
function embedUrl(u){const y=(u||"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]+)/);if(y)return "https://www.youtube.com/embed/"+y[1];const v=(u||"").match(/vimeo\.com\/(\d+)/);if(v)return "https://player.vimeo.com/video/"+v[1];return u;}
function ctaLabel(m){return{video:"I've watched this",link_submission:"Submit link",scheduler:"I've booked my session",datetime:"Submit date",acknowledgment:"I acknowledge & agree",file_upload:"Upload & complete",embedded_academy:"I've finished the course",mark_complete:(m.cta_label||"Mark as complete")}[m.type]||"Mark as complete";}

function computeStatuses(modules,progress){
  const by={};(progress||[]).forEach(p=>by[p.module_id]=p);
  let ok=true;
  return [...modules].sort((a,b)=>a.order_index-b.order_index).map(m=>{
    const ex=by[m.id];let st;
    if(ex&&ex.status==="complete")st="complete";
    else if(ex&&ex.status==="submitted")st="submitted";
    else st=ok?"available":"locked";
    if(m.is_blocking&&st!=="complete")ok=false;
    return {...m,_status:st,_progress:ex||null};
  });
}
async function ensureProgress(aid,mid){
  const {data,error}=await sb.from("progress").upsert({agent_id:aid,module_id:mid,status:"available"},{onConflict:"agent_id,module_id",ignoreDuplicates:false}).select().single();
  if(error)throw error;return data;
}
async function saveSubmission(pid,type,payload){const {error}=await sb.from("submissions").insert({progress_id:pid,type,payload});if(error)throw error;}
async function setStatus(pid,status,by){var b=(by===undefined)?null:by;const p={status};if(status==="complete"){p.completed_at=new Date().toISOString();p.completed_by=b;}const {error}=await sb.from("progress").update(p).eq("id",pid);if(error)throw error;}

async function route(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){show("login");return;}
  const {data:profile}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
  ME={user:session.user,profile};
  if(profile&&profile.role==="admin"){show("admin");initAdmin();}
  else{show("agent");initAgent();}
}

async function doSignIn(){
  const e=document.getElementById("login-err");e.textContent="";
  const email=document.getElementById("email").value.trim();
  const pw=document.getElementById("password").value;
  if(!email||!pw){e.textContent="Enter your email and password.";return;}
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){e.textContent="That email and password didn't match. Try again.";return;}
  route();
}
document.getElementById("signin").addEventListener("click",doSignIn);
document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")doSignIn();});

/* ===== AGENT ===== */
let AGENT_MODS=[];
async function initAgent(){
  document.getElementById("agent-who").textContent=ME.profile&&ME.profile.full_name?ME.profile.full_name:ME.user.email;
  const f=((ME.profile&&ME.profile.full_name)||"").split(" ")[0];
  document.getElementById("greeting").textContent=f?("Welcome, "+f+"."):"Welcome.";
  await loadAgent();
}
async function loadAgent(){
  const {data:modules}=await sb.from("modules").select("*").eq("is_published",true).order("order_index");
  const {data:progress}=await sb.from("progress").select("*").eq("agent_id",ME.user.id);
  AGENT_MODS=computeStatuses(modules||[],progress||[]);
  renderAgent();
}
function renderAgent(){
  const total=AGENT_MODS.length,done=AGENT_MODS.filter(m=>m._status==="complete").length;
  document.getElementById("meter-label").textContent=done+" of "+total+" complete";
  document.getElementById("meter-fill").style.width=total?((done/total)*100)+"%":"0%";
  const list=document.getElementById("agent-modules");list.innerHTML="";
  AGENT_MODS.forEach((m,i)=>{
    const locked=m._status==="locked";
    const el=document.createElement("button");
    el.className="module"+(locked?" is-locked":"");
    el.innerHTML='<span class="idx">'+String(i+1).padStart(2,"0")+'</span><span><div class="m-title">'+esc(m.title)+'</div><div class="m-sub">'+esc(m.description||typeLabel(m.type))+'</div></span><span class="pill '+m._status+'">'+statusText(m._status)+'</span>';
    el.addEventListener("click",()=>{if(!locked)showModulePage(m);});
    list.appendChild(el);
  });
}
document.getElementById("module-back").addEventListener("click",async()=>{await loadAgent();show("agent");});

function showModulePage(m){
  const c=m.content||{};
  const i=AGENT_MODS.indexOf(m);
  const done=m._status==="complete";const awaiting=m._status==="submitted";const dis=(done||awaiting)?"disabled":"";
  let h='<div class="page-head"><span class="label">Step '+String(i+1).padStart(2,"0")+' &middot; '+typeLabel(m.type)+'</span><h1>'+esc(m.title)+'</h1><p>'+esc(m.description||"")+'</p></div>';

  if(c.video_url)h+='<iframe class="embed" src="'+embedUrl(c.video_url)+'" allowfullscreen></iframe>';

  if(m.type==="link_submission"){
    h+='<label class="label flabel">Paste your link</label><input class="field" id="link" type="url" placeholder="https://linktr.ee/yourname" '+dis+'>';
  }else if(m.type==="datetime"){
    h+='<label class="label flabel">'+esc(c.prompt||"Choose a date and time")+'</label><input class="field" id="dt" type="datetime-local" '+dis+'>';
  }else if(m.type==="scheduler"){
    h+=c.calendar_url?'<iframe class="cal" src="'+esc(c.calendar_url)+'"></iframe>':'<p class="note">No booking link set yet.</p>';
    h+='<p class="note">Book a time above. Your coach marks this complete after your session.</p>';
  }else if(m.type==="acknowledgment"){
    h+='<div class="body-html">'+(c.body_html||"")+'</div>';
  }else if(m.type==="file_upload"){
    h+='<label class="label flabel">Upload your file</label><input class="field" id="file" type="file" '+dis+'>';
  }else if(m.type==="embedded_academy"){
    h+=c.academy_url?'<div class="row"><a class="btn" href="'+esc(c.academy_url)+'" target="_blank" rel="noopener">Open the Academy</a></div>':"";
    h+='<p class="note">Live scoring lands here in a later update.</p>';
  }else if(m.type==="mark_complete"){
    h+=c.body_html?'<div class="body-html">'+c.body_html+'</div>':"";
  }

  if(Array.isArray(c.links)&&c.links.length){
    h+='<div class="row" style="margin-top:18px">';
    c.links.forEach(l=>{if(l&&l.url)h+='<a class="btn ghost" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label||"Open link")+'</a>';});
    h+='</div>';
  }

  h+='<div class="complete-zone">';
  if(done)h+='<span class="pill complete">Completed</span>';
  else if(awaiting)h+='<span class="pill submitted">Submitted &mdash; waiting on your coach</span>';
  else h+='<button class="btn" id="cta">'+esc(ctaLabel(m))+'</button>';
  h+='<div class="err" id="serr"></div></div>';

  document.getElementById("module-body").innerHTML=h;
  show("module");window.scrollTo(0,0);
  const cta=document.getElementById("cta");if(cta)cta.addEventListener("click",()=>handleCta(m));
}
async function handleCta(m){
  const serr=document.getElementById("serr");serr.textContent="";
  try{
    const prog=await ensureProgress(ME.user.id,m.id);
    if(m.type==="link_submission"){const u=document.getElementById("link").value.trim();if(!u){serr.textContent="Paste your link first.";return;}await saveSubmission(prog.id,"link",{url:u});}
    else if(m.type==="datetime"){const v=document.getElementById("dt").value;if(!v){serr.textContent="Pick a date and time first.";return;}await saveSubmission(prog.id,"datetime",{datetime:v});}
    else if(m.type==="file_upload"){const f=document.getElementById("file").files[0];if(!f){serr.textContent="Choose a file first.";return;}const path=ME.user.id+"/"+m.id+"/"+Date.now()+"_"+f.name;const {error}=await sb.storage.from("submissions").upload(path,f);if(error){serr.textContent="Upload failed: "+error.message;return;}await saveSubmission(prog.id,"file",{path});}
    else if(m.type==="scheduler"){await saveSubmission(prog.id,"booking",{note:"Agent confirmed booking"});}
    if(m.completion_authority==="admin")await setStatus(prog.id,"submitted");
    else await setStatus(prog.id,"complete",ME.user.id);
    await loadAgent();show("agent");window.scrollTo(0,0);
  }catch(e){serr.textContent="Something went wrong. Try again.";console.error(e);}
}

/* ===== ADMIN ===== */
let ADMIN_MODS=[];let MOVING=false;
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");
  const v=t.dataset.tab;
  document.getElementById("tab-modules").style.display=v==="modules"?"block":"none";
  document.getElementById("tab-agents").style.display=v==="agents"?"block":"none";
  if(v==="agents")loadAgents();
}));
document.getElementById("new-module").addEventListener("click",()=>openEditor(null));
async function initAdmin(){
  document.getElementById("admin-who").textContent=ME.profile&&ME.profile.full_name?ME.profile.full_name:ME.user.email;
  await loadAdminModules();
}
async function loadAdminModules(){
  const {data}=await sb.from("modules").select("*").order("order_index");
  ADMIN_MODS=data||[];renderAdminModules();
}
function renderAdminModules(){
  const box=document.getElementById("admin-modules");box.innerHTML="";
  if(!ADMIN_MODS.length){box.innerHTML='<p class="note">No modules yet. Hit "New module" to add your first onboarding step.</p>';return;}
  ADMIN_MODS.forEach((m,i)=>{
    const tags=[typeLabel(m.type),m.completion_authority==="admin"?"admin-verified":"self",m.is_blocking?"blocking":"non-blocking",m.is_published?"published":"hidden"].join(" &middot; ");
    const el=document.createElement("div");el.className="mod-row";
    el.innerHTML='<span class="idx">'+String(i+1).padStart(2,"0")+'</span><span><div class="t">'+esc(m.title)+'</div><div class="s">'+tags+'</div></span><span class="ctrls"><button class="icon-btn" data-up '+(i===0?"disabled":"")+'>&uarr;</button><button class="icon-btn" data-down '+(i===ADMIN_MODS.length-1?"disabled":"")+'>&darr;</button><button class="btn ghost sm" data-edit>Edit</button><button class="btn danger sm" data-del>Delete</button></span>';
    el.querySelector("[data-up]").addEventListener("click",()=>moveModule(i,-1));
    el.querySelector("[data-down]").addEventListener("click",()=>moveModule(i,1));
    el.querySelector("[data-edit]").addEventListener("click",()=>openEditor(m));
    el.querySelector("[data-del]").addEventListener("click",()=>delModule(m));
    box.appendChild(el);
  });
}
async function moveModule(i,dir){
  if(MOVING)return;
  const j=i+dir;if(j<0||j>=ADMIN_MODS.length)return;
  MOVING=true;
  try{
    const arr=ADMIN_MODS.slice();
    const tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
    // renumber everything cleanly 1..n so order can never drift or stick
    for(let k=0;k<arr.length;k++){await sb.from("modules").update({order_index:k+1}).eq("id",arr[k].id);}
    await loadAdminModules();
  }catch(e){console.error(e);}
  MOVING=false;
}
async function delModule(m){
  if(!confirm('Delete "'+m.title+'"? This removes it for everyone.'))return;
  await sb.from("modules").delete().eq("id",m.id);await loadAdminModules();
}
function openEditor(m){
  const e=m||{};const c=e.content||{};
  const sel=(v,opt)=>opt.map(o=>'<option value="'+o[0]+'"'+(v===o[0]?" selected":"")+'>'+o[1]+'</option>').join("");
  const typeOpts=[["video","Video"],["link_submission","Submit a link"],["scheduler","Book a session (embedded calendar)"],["datetime","Pick a date & time"],["acknowledgment","Acknowledge"],["file_upload","Upload a file"],["embedded_academy","Academy course"],["mark_complete","Plain task"]];
  let h='<span class="label">'+(m?"Edit module":"New module")+'</span><h2 style="margin-bottom:18px">Module details</h2>';
  h+='<label class="label flabel">Title</label><input class="field" id="e-title" value="'+esc(e.title||"")+'">';
  h+='<label class="label flabel">Description (shown to agent)</label><textarea class="field" id="e-desc">'+esc(e.description||"")+'</textarea>';
  h+='<label class="label flabel">Type</label><select class="field" id="e-type">'+sel(e.type||"video",typeOpts)+'</select>';
  h+='<div id="e-typefields"></div>';
  h+='<div style="border-top:1px solid var(--line);margin:14px 0;padding-top:14px"><span class="label" style="display:block;margin-bottom:10px">Additional content (optional, any module)</span>';
  h+='<label class="label flabel">Embed a video (YouTube / Vimeo URL)</label><input class="field" id="c-video" value="'+esc(c.video_url||"")+'">';
  h+='<label class="label flabel">Resource links &mdash; button label + URL</label><div id="c-links"></div><button class="btn ghost sm" type="button" id="c-addlink">+ Add link</button></div>';
  h+='<label class="label flabel">Who marks it complete?</label><select class="field" id="e-auth">'+sel(e.completion_authority||"self",[["self","The agent (self-serve)"],["admin","A coach / admin"]])+'</select>';
  h+='<label class="row" style="margin-bottom:10px"><input type="checkbox" id="e-block" '+((e.is_blocking===undefined?true:e.is_blocking)?"checked":"")+'> <span>Blocking &mdash; must finish before the next module unlocks</span></label>';
  h+='<label class="row" style="margin-bottom:16px"><input type="checkbox" id="e-pub" '+((e.is_published===undefined?true:e.is_published)?"checked":"")+'> <span>Published &mdash; visible to agents</span></label>';
  h+='<div class="err" id="e-err"></div>';
  h+='<div class="row" style="margin-top:8px"><button class="btn" id="e-save">Save module</button><button class="btn ghost" id="e-cancel">Cancel</button></div>';
  document.getElementById("sheet").innerHTML=h;
  document.getElementById("overlay").classList.add("open");

  const renderTypeFields=()=>{
    const t=document.getElementById("e-type").value;let f="";
    if(t==="scheduler")f='<label class="label flabel">Google appointment / Calendly embed URL</label><input class="field" id="c-cal" value="'+esc(c.calendar_url||"")+'">';
    else if(t==="datetime")f='<label class="label flabel">Question shown to the agent</label><input class="field" id="c-prompt" value="'+esc(c.prompt||"")+'" placeholder="e.g. When is your photo session booked for?">';
    else if(t==="embedded_academy")f='<label class="label flabel">Academy URL</label><input class="field" id="c-acad" value="'+esc(c.academy_url||"")+'">';
    else if(t==="acknowledgment"||t==="mark_complete")f='<label class="label flabel">Body text (HTML allowed)</label><textarea class="field" id="c-body">'+esc(c.body_html||"")+'</textarea>';
    else if(t==="link_submission")f='<p class="note">Agent pastes a link. No extra setup needed.</p>';
    else if(t==="file_upload")f='<p class="note">Agent uploads a file. Requires a Storage bucket named "submissions".</p>';
    else if(t==="video")f='<p class="note">Set the video in the "Embed a video" field below.</p>';
    document.getElementById("e-typefields").innerHTML=f;
  };
  renderTypeFields();
  document.getElementById("e-type").addEventListener("change",renderTypeFields);

  const linksBox=document.getElementById("c-links");
  const addLinkRow=(l)=>{
    l=l||{};
    const r=document.createElement("div");r.className="row link-row";r.style.marginBottom="8px";
    r.innerHTML='<input class="field link-label" style="flex:1;min-width:120px" placeholder="Button label" value="'+esc(l.label||"")+'"><input class="field link-url" style="flex:2;min-width:160px" placeholder="https://..." value="'+esc(l.url||"")+'"><button class="icon-btn link-del" type="button">&times;</button>';
    r.querySelector(".link-del").addEventListener("click",()=>r.remove());
    linksBox.appendChild(r);
  };
  (Array.isArray(c.links)?c.links:[]).forEach(addLinkRow);
  document.getElementById("c-addlink").addEventListener("click",()=>addLinkRow());

  document.getElementById("e-cancel").addEventListener("click",closeSheet);
  document.getElementById("e-save").addEventListener("click",()=>saveModule(m));
}
async function saveModule(existing){
  const err=document.getElementById("e-err");err.textContent="";
  const title=document.getElementById("e-title").value.trim();
  if(!title){err.textContent="Give the module a title.";return;}
  const type=document.getElementById("e-type").value;
  const content={};
  const v=document.getElementById("c-video").value.trim();if(v)content.video_url=v;
  const links=[];document.querySelectorAll("#c-links .link-row").forEach(r=>{const lab=r.querySelector(".link-label").value.trim();const url=r.querySelector(".link-url").value.trim();if(url)links.push({label:lab||"Open link",url});});if(links.length)content.links=links;
  let el;
  if(type==="scheduler"){el=document.getElementById("c-cal");if(el)content.calendar_url=el.value.trim();}
  else if(type==="datetime"){el=document.getElementById("c-prompt");if(el)content.prompt=el.value.trim();}
  else if(type==="embedded_academy"){el=document.getElementById("c-acad");if(el)content.academy_url=el.value.trim();}
  else if(type==="acknowledgment"||type==="mark_complete"){el=document.getElementById("c-body");if(el)content.body_html=el.value;}
  const rec={
    title,description:document.getElementById("e-desc").value.trim(),type,content,
    completion_authority:document.getElementById("e-auth").value,
    is_blocking:document.getElementById("e-block").checked,
    is_published:document.getElementById("e-pub").checked,
    updated_at:new Date().toISOString()
  };
  try{
    if(existing&&existing.id){const {error}=await sb.from("modules").update(rec).eq("id",existing.id);if(error)throw error;}
    else{const max=ADMIN_MODS.reduce((a,m)=>Math.max(a,m.order_index),0);rec.order_index=max+1;const {error}=await sb.from("modules").insert(rec);if(error)throw error;}
    closeSheet();await loadAdminModules();
  }catch(e){err.textContent="Save failed: "+e.message;console.error(e);}
}
async function loadAgents(){
  const box=document.getElementById("admin-agents");box.innerHTML='<p class="note">Loading...</p>';
  const {data:agents}=await sb.from("profiles").select("*").eq("role","agent").order("full_name");
  const {data:modules}=await sb.from("modules").select("*").eq("is_published",true).order("order_index");
  box.innerHTML="";
  if(!agents||!agents.length){box.innerHTML='<p class="note">No agents yet. Add them in Supabase &rarr; Authentication &rarr; Users &rarr; Create new user.</p>';return;}
  for(const a of agents){
    const {data:prog}=await sb.from("progress").select("*").eq("agent_id",a.id);
    const computed=computeStatuses(modules||[],prog||[]);
    const done=computed.filter(m=>m._status==="complete").length;
    const card=document.createElement("div");card.className="agent-card";
    card.innerHTML='<div class="head"><div><div class="name">'+esc(a.full_name||a.email)+'</div><div class="email">'+esc(a.email||"")+'</div></div><span class="pill '+(done===computed.length&&computed.length?"complete":"available")+'">'+done+' / '+computed.length+'</span></div><div class="agent-prog"></div>';
    const head=card.querySelector(".head"),body=card.querySelector(".agent-prog");
    head.addEventListener("click",()=>body.classList.toggle("open"));
    computed.forEach((m,i)=>{
      const line=document.createElement("div");line.className="prog-line";
      let right='<span class="pill '+m._status+'">'+statusText(m._status)+'</span>';
      if(m._status==="submitted"&&m.completion_authority==="admin")right='<button class="btn sm" data-done>Mark complete</button>';
      line.innerHTML='<span class="pl-title">'+String(i+1).padStart(2,"0")+'. '+esc(m.title)+'</span>'+right;
      const db=line.querySelector("[data-done]");
      if(db)db.addEventListener("click",async(ev)=>{ev.stopPropagation();if(m._progress){await setStatus(m._progress.id,"complete",ME.user.id);await loadAgents();}});
      body.appendChild(line);
    });
    box.appendChild(card);
  }
}

route();
</script>
