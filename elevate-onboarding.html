<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elevate Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cream:#FAF7F0; --ink:#121212; --blue:#0066ff; --blue-dk:#0047b3;
    --muted:#6f6a60; --line:#e4ddce; --card:#ffffff; --good:#1f9d57;
    --warn:#b8851f; --lock:#b9b2a4; --shadow:0 1px 2px rgba(18,18,18,.06),0 8px 24px rgba(18,18,18,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5}
  h1,h2,h3{font-family:"Playfair Display",Georgia,serif;font-weight:700;letter-spacing:-.01em}
  .mono{font-family:"DM Mono",monospace}
  .eyebrow{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  a{color:var(--blue);text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,textarea,select{font-family:inherit;font-size:15px;width:100%;padding:11px 13px;
    border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,102,255,.12)}
  label.field{display:block;margin-bottom:14px}
  label.field .lab{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;
    padding:11px 20px;border-radius:9px;font-weight:600;font-size:15px;transition:.15s}
  .btn:hover{background:var(--blue-dk)}
  .btn:disabled{background:var(--lock);cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--ink);background:#fff}
  .btn.sm{padding:7px 13px;font-size:13px;border-radius:7px}
  .btn.danger{background:transparent;color:#c0392b;border:1px solid #e7c3bd}
  .btn.danger:hover{background:#fdf2f0}
  /* ---- top bar ---- */
  header.bar{background:var(--ink);color:#fff;padding:0 24px;height:60px;display:flex;
    align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mark{width:30px;height:30px;border-radius:7px;background:var(--blue);display:grid;
    place-items:center;font-family:"Playfair Display";font-weight:800;color:#fff;font-size:17px}
  .brand .name{font-family:"DM Mono";font-size:13px;letter-spacing:.14em;text-transform:uppercase}
  .barright{display:flex;align-items:center;gap:16px;font-size:13px}
  .barright .who{color:#cfcabd;font-family:"DM Mono";font-size:12px}
  .linklike{color:#cfcabd;font-size:13px}.linklike:hover{color:#fff}
  /* ---- layout ---- */
  .wrap{max-width:920px;margin:0 auto;padding:40px 24px 80px}
  .pagehead{margin-bottom:34px}
  .pagehead h1{font-size:34px;margin:6px 0 4px}
  .pagehead p{color:var(--muted);max-width:560px}
  /* ---- auth ---- */
  .authscreen{min-height:100vh;display:grid;place-items:center;padding:24px}
  .authcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:38px 34px;width:100%;max-width:400px;box-shadow:var(--shadow)}
  .authcard .mark{width:42px;height:42px;border-radius:10px;background:var(--blue);display:grid;
    place-items:center;font-family:"Playfair Display";font-weight:800;color:#fff;font-size:23px;margin-bottom:20px}
  .authcard h1{font-size:25px;margin-bottom:4px}
  .authcard .sub{color:var(--muted);font-size:14px;margin-bottom:26px}
  .toggle{margin-top:18px;font-size:14px;color:var(--muted);text-align:center}
  .msg{font-size:13px;padding:10px 13px;border-radius:8px;margin-bottom:16px;display:none}
  .msg.err{display:block;background:#fdf2f0;color:#c0392b;border:1px solid #f0d2cc}
  .msg.ok{display:block;background:#eef8f1;color:var(--good);border:1px solid #cfe9d8}
  /* ---- progress spine (agent) ---- */
  .spine{position:relative;padding-left:14px}
  .node{position:relative;display:flex;gap:20px;padding-bottom:18px}
  .node:before{content:"";position:absolute;left:18px;top:38px;bottom:-4px;width:2px;background:var(--line)}
  .node:last-child:before{display:none}
  .node.complete:before{background:var(--blue)}
  .dot{flex:0 0 38px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    font-family:"DM Mono";font-size:14px;font-weight:500;z-index:1;border:2px solid var(--line);
    background:#fff;color:var(--lock)}
  .node.available .dot{border-color:var(--blue);color:var(--blue)}
  .node.submitted .dot{border-color:var(--warn);color:var(--warn)}
  .node.complete .dot{border-color:var(--blue);background:var(--blue);color:#fff}
  .mcard{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:18px 20px;transition:.15s}
  .node.available .mcard,.node.submitted .mcard{box-shadow:var(--shadow)}
  .node.locked .mcard{opacity:.6}
  .mcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .mcard h3{font-size:19px;margin-bottom:3px}
  .mcard .desc{color:var(--muted);font-size:14px}
  .pill{font-family:"DM Mono";font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:4px 9px;border-radius:20px;white-space:nowrap}
  .pill.available{background:#eaf1ff;color:var(--blue)}
  .pill.complete{background:#eef8f1;color:var(--good)}
  .pill.submitted{background:#fcf5e6;color:var(--warn)}
  .pill.locked{background:#f2efe7;color:var(--lock)}
  .typetag{font-family:"DM Mono";font-size:11px;color:var(--muted);margin-top:10px;display:inline-block}
  /* ---- module detail ---- */
  .back{font-family:"DM Mono";font-size:12px;letter-spacing:.08em;color:var(--muted);
    display:inline-flex;align-items:center;gap:6px;margin-bottom:22px}
  .back:hover{color:var(--ink)}
  .detailcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:30px;box-shadow:var(--shadow)}
  .detailcard .body-html{margin:18px 0;color:#2a2a2a}
  .detailcard .body-html p{margin-bottom:10px}
  .embed{width:100%;height:560px;border:1px solid var(--line);border-radius:11px;margin:18px 0}
  .video-wrap{position:relative;padding-bottom:56.25%;height:0;margin:18px 0;border-radius:11px;overflow:hidden;border:1px solid var(--line)}
  .video-wrap iframe{position:absolute;inset:0;width:100%;height:100%}
  .actionbar{display:flex;gap:12px;align-items:center;margin-top:24px;flex-wrap:wrap}
  .note{font-size:13px;color:var(--muted)}
  /* ---- admin ---- */
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:28px}
  .tab{font-family:"DM Mono";font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    padding:12px 16px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--ink);border-bottom-color:var(--blue)}
  .row{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:15px 18px;
    margin-bottom:10px;display:flex;align-items:center;gap:16px}
  .row .ord{font-family:"DM Mono";font-size:13px;color:var(--blue);width:26px;flex:0 0 26px}
  .row .rmain{flex:1}
  .row .rmain .rt{font-weight:600;font-size:15px}
  .row .rmain .rs{font-size:12px;color:var(--muted);font-family:"DM Mono";margin-top:2px}
  .row .ractions{display:flex;gap:6px;align-items:center}
  .badge{font-family:"DM Mono";font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    padding:3px 8px;border-radius:5px;background:#f2efe7;color:var(--muted)}
  .badge.admin{background:#eaf1ff;color:var(--blue)}
  .badge.draft{background:#fcf5e6;color:var(--warn)}
  /* progress matrix */
  .matrix{overflow-x:auto}
  table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  th,td{padding:11px 13px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
  th{font-family:"DM Mono";font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:#faf8f2}
  td .cell{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;font-size:12px}
  .cell.c{background:var(--blue);color:#fff}
  .cell.s{background:#fcf5e6;color:var(--warn);border:1px solid #ecd9a8}
  .cell.o{background:#f2efe7;color:var(--lock)}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(18,18,18,.4);display:none;place-items:center;
    z-index:50;padding:24px;overflow-y:auto}
  .modal.on{display:grid}
  .modalcard{background:var(--cream);border-radius:16px;padding:30px;width:100%;max-width:540px;
    box-shadow:0 24px 60px rgba(0,0,0,.25);margin:auto}
  .modalcard h2{font-size:23px;margin-bottom:20px}
  .modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .x{font-size:22px;color:var(--muted);line-height:1}
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .big{font-family:"Playfair Display";font-size:21px;color:var(--ink);margin-bottom:6px}
  .hidden{display:none!important}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:560px){.pagehead h1{font-size:27px}.detailcard{padding:22px}.node{gap:14px}}
</style>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth" class="authscreen">
  <div class="authcard">
    <div class="mark">E</div>
    <h1 id="authTitle">Welcome back</h1>
    <p class="sub" id="authSub">Sign in to continue your onboarding.</p>
    <div class="msg" id="authMsg"></div>
    <label class="field" id="nameField" style="display:none">
      <span class="lab">Full name</span>
      <input id="fName" placeholder="Jordan Smith" autocomplete="name">
    </label>
    <label class="field"><span class="lab">Email</span>
      <input id="fEmail" type="email" placeholder="you@elevate.com" autocomplete="email"></label>
    <label class="field"><span class="lab">Password</span>
      <input id="fPass" type="password" placeholder="••••••••" autocomplete="current-password"></label>
    <button class="btn" id="authBtn" style="width:100%;justify-content:center">Sign in</button>
    <p class="toggle">
      <span id="toggleText">New to the team?</span>
      <a href="#" id="toggleLink">Create an account</a>
    </p>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app" class="hidden">
  <header class="bar">
    <div class="brand"><div class="mark">E</div><span class="name">Elevate Onboarding</span></div>
    <div class="barright">
      <a href="#" class="linklike hidden" id="adminSwitch">Admin</a>
      <a href="#" class="linklike hidden" id="agentSwitch">My onboarding</a>
      <span class="who" id="whoami"></span>
      <a href="#" class="linklike" id="logoutBtn">Sign out</a>
    </div>
  </header>
  <div class="wrap" id="view"></div>
</div>

<!-- ============ MODULE EDITOR MODAL ============ -->
<div class="modal" id="modal">
  <div class="modalcard">
    <div class="modalhead">
      <h2 id="modalTitle">New module</h2>
      <button class="x" id="modalClose">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — paste your two values from Supabase → Project Settings → API
   ============================================================ */
const SUPABASE_URL  = "https://gqtvjskjifzzjjvkewmd.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxdHZqc2tqaWZ6empqdmtld21kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MTc3NTMsImV4cCI6MjA5NzE5Mzc1M30.Ua0V7aIEGx4XgXUi8Me1Z4i9ZL14I8289HenpMOHZMg";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

/* module type catalogue — drives the admin editor + agent renderer */
const TYPES = {
  mark_complete:    { label:"Content + done button", fields:["body_html"], cta:"Mark as complete" },
  video:            { label:"Watch a video",          fields:["video_url","body_html"], cta:"Mark as watched" },
  link_submission:  { label:"Submit a link",          fields:["prompt"], cta:"Submit link" },
  scheduler:        { label:"Book the 1-on-1",         fields:["booking_url","body_html"], cta:"I've booked my 1-on-1" },
  acknowledgment:   { label:"Read & acknowledge",      fields:["body_html"], cta:"I have read & I agree" },
  file_upload:      { label:"Upload a file",           fields:["prompt"], cta:"Upload file" },
  embedded_academy: { label:"Elevate Academy course",  fields:["academy_url","body_html"], cta:"Mark course complete" },
};
const FIELD_LABELS = {
  body_html:"Content (HTML allowed)", video_url:"Video embed URL (YouTube/Vimeo embed link)",
  prompt:"Instructions for the agent", booking_url:"Your Google Calendar booking link",
  academy_url:"Academy course URL",
};

let ME = null;            // profile row
let CURRENT_VIEW = "agent";

/* ---------------- AUTH ---------------- */
let mode = "signin";
const $ = id => document.getElementById(id);
function authMsg(t,k){const m=$("authMsg");m.textContent=t;m.className="msg "+(k||"err");}
function setMode(m){
  mode=m;
  const signup = m==="signup";
  $("authTitle").textContent = signup?"Join the team":"Welcome back";
  $("authSub").textContent = signup?"Create your account to start onboarding.":"Sign in to continue your onboarding.";
  $("nameField").style.display = signup?"block":"none";
  $("authBtn").textContent = signup?"Create account":"Sign in";
  $("toggleText").textContent = signup?"Already have an account?":"New to the team?";
  $("toggleLink").textContent = signup?"Sign in":"Create an account";
  $("authMsg").className="msg";
}
$("toggleLink").onclick = e=>{e.preventDefault();setMode(mode==="signin"?"signup":"signin");};
$("authBtn").onclick = async ()=>{
  const email=$("fEmail").value.trim(), pass=$("fPass").value;
  if(!email||!pass){authMsg("Enter your email and password.");return;}
  const btn=$("authBtn");btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  try{
    if(mode==="signup"){
      const name=$("fName").value.trim();
      const {error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
      if(error)throw error;
      authMsg("Account created — signing you in…","ok");
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
    }
  }catch(err){authMsg(err.message||"Something went wrong.");}
  btn.disabled=false;btn.textContent = mode==="signup"?"Create account":"Sign in";
};
$("logoutBtn").onclick = async e=>{e.preventDefault();await sb.auth.signOut();location.reload();};

/* ---------------- SESSION BOOT ---------------- */
sb.auth.onAuthStateChange((_e,session)=>{ session ? boot() : showAuth(); });
async function showAuth(){$("app").classList.add("hidden");$("auth").style.display="grid";}
async function boot(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return showAuth();
  let {data:prof}=await sb.from("profiles").select("*").eq("id",user.id).single();
  if(!prof){ // safety net if trigger hasn't fired
    await sb.from("profiles").insert({id:user.id,email:user.email});
    ({data:prof}=await sb.from("profiles").select("*").eq("id",user.id).single());
  }
  ME=prof;
  $("auth").style.display="none";$("app").classList.remove("hidden");
  $("whoami").textContent=(ME.full_name||ME.email)+(ME.role==="admin"?" · admin":"");
  if(ME.role==="admin"){
    $("adminSwitch").classList.remove("hidden");$("agentSwitch").classList.remove("hidden");
    CURRENT_VIEW="admin";
  }
  render();
}
$("adminSwitch").onclick=e=>{e.preventDefault();CURRENT_VIEW="admin";render();};
$("agentSwitch").onclick=e=>{e.preventDefault();CURRENT_VIEW="agent";render();};

function render(){ CURRENT_VIEW==="admin"&&ME.role==="admin" ? renderAdmin() : renderAgent(); }

/* ============================================================
   AGENT SIDE
   ============================================================ */
async function fetchAgentData(agentId){
  const {data:modules}=await sb.from("modules").select("*").eq("is_published",true).order("order_index");
  const {data:prog}=await sb.from("progress").select("*").eq("agent_id",agentId);
  const pmap={}; (prog||[]).forEach(p=>pmap[p.module_id]=p);
  return {modules:modules||[],pmap};
}
function computeStates(modules,pmap){
  let priorBlockingDone=true, out=[];
  for(const m of modules){
    const p=pmap[m.id];
    const done=p&&p.status==="complete";
    const submitted=p&&p.status==="submitted";
    let state;
    if(done)state="complete";
    else if(priorBlockingDone)state=submitted?"submitted":"available";
    else state="locked";
    out.push({...m,state,prog:p});
    if(m.is_blocking&&!done)priorBlockingDone=false;
  }
  return out;
}
async function renderAgent(){
  const v=$("view");v.innerHTML='<div class="empty">Loading your onboarding…</div>';
  const {modules,pmap}=await fetchAgentData(ME.id);
  const states=computeStates(modules,pmap);
  const total=states.length, done=states.filter(s=>s.state==="complete").length;
  let html=`<div class="pagehead">
      <span class="eyebrow">Your onboarding · ${done} of ${total} complete</span>
      <h1>Welcome${ME.full_name?", "+ME.full_name.split(" ")[0]:""}.</h1>
      <p>Work through each step in order. The next one unlocks once you finish the one before it.</p>
    </div>`;
  if(!total){html+=`<div class="empty"><div class="big">No modules yet</div>Your onboarding steps will appear here once they're set up.</div>`;v.innerHTML=html;return;}
  html+='<div class="spine">';
  states.forEach((m,i)=>{
    const mark = m.state==="complete"?"&#10003;":(i+1);
    html+=`<div class="node ${m.state}">
      <div class="dot">${mark}</div>
      <div class="mcard">
        <div class="top">
          <div><h3>${esc(m.title)}</h3>${m.description?`<div class="desc">${esc(m.description)}</div>`:""}</div>
          <span class="pill ${m.state}">${m.state}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="typetag">${TYPES[m.type]?.label||m.type}</span>
          ${m.state==="locked"?'<span class="note">🔒 Finish the step above first</span>':
            `<button class="btn sm ${m.state==='complete'?'ghost':''}" onclick="openModule('${m.id}')">${m.state==="complete"?"Review":"Open"}</button>`}
        </div>
      </div></div>`;
  });
  html+='</div>';
  v.innerHTML=html;
}

window.openModule = async (id)=>{
  const v=$("view");
  const {data:m}=await sb.from("modules").select("*").eq("id",id).single();
  const {data:prog}=await sb.from("progress").select("*,submissions(*)").eq("agent_id",ME.id).eq("module_id",id).maybeSingle();
  const c=m.content||{}, status=prog?.status||"available", done=status==="complete", submitted=status==="submitted";
  let inner="";
  if(c.body_html) inner+=`<div class="body-html">${c.body_html}</div>`;
  if(m.type==="video"&&c.video_url) inner+=`<div class="video-wrap"><iframe src="${esc(c.video_url)}" allowfullscreen></iframe></div>`;
  if(m.type==="scheduler"&&c.booking_url) inner+=`<iframe class="embed" src="${esc(c.booking_url)}"></iframe>`;
  if(m.type==="embedded_academy"&&c.academy_url) inner+=`<iframe class="embed" src="${esc(c.academy_url)}"></iframe>`;
  if(c.prompt) inner+=`<p class="note" style="margin:8px 0 4px">${esc(c.prompt)}</p>`;
  if(m.type==="link_submission") inner+=`<label class="field"><span class="lab">Your link</span><input id="subLink" placeholder="https://linktr.ee/you" value="${esc(prog?.submissions?.[0]?.payload?.url||'')}"></label>`;
  if(m.type==="file_upload") inner+=`<label class="field"><span class="lab">Choose file</span><input id="subFile" type="file"></label>${prog?.submissions?.[0]?.payload?.path?`<p class="note">Current: ${esc(prog.submissions[0].payload.name||'uploaded file')}</p>`:""}`;

  // action area
  let action="";
  if(done){
    action=`<span class="pill complete">Completed</span><span class="note">Nice work — this step is done.</span>`;
  }else if(submitted){
    action=`<span class="pill submitted">Submitted</span><span class="note">Thanks — this is with the team for final sign-off.</span>`;
  }else{
    const adminAuth=m.completion_authority==="admin";
    action=`<button class="btn" id="doBtn">${esc(m.cta_label||TYPES[m.type]?.cta||'Mark as complete')}</button>`;
    if(adminAuth) action+=`<span class="note">The team confirms this one after your session.</span>`;
  }

  v.innerHTML=`<a href="#" class="back" onclick="renderAgent();return false">← All steps</a>
    <div class="detailcard">
      <span class="eyebrow">${TYPES[m.type]?.label||m.type}</span>
      <h1 style="font-size:28px;margin:6px 0 4px">${esc(m.title)}</h1>
      ${m.description?`<p class="note" style="font-size:15px">${esc(m.description)}</p>`:""}
      ${inner}
      <div class="actionbar">${action}</div>
    </div>`;

  const doBtn=$("doBtn");
  if(doBtn) doBtn.onclick = ()=>completeAction(m,prog);
};

async function completeAction(m,prog){
  const btn=$("doBtn");btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  try{
    // ensure a progress row exists
    let pid=prog?.id;
    if(!pid){
      const {data}=await sb.from("progress").insert({agent_id:ME.id,module_id:m.id,status:"available"}).select().single();
      pid=data.id;
    }
    // gather + store submission artifact where relevant
    if(m.type==="link_submission"){
      const url=$("subLink").value.trim();
      if(!url){alert("Please paste your link first.");btn.disabled=false;btn.textContent=m.cta_label;return;}
      await sb.from("submissions").insert({progress_id:pid,type:"link",payload:{url}});
    }
    if(m.type==="file_upload"){
      const f=$("subFile").files[0];
      if(!f){alert("Please choose a file first.");btn.disabled=false;btn.textContent=m.cta_label;return;}
      const path=`${ME.id}/${m.id}/${Date.now()}_${f.name}`;
      const {error:upErr}=await sb.storage.from("submissions").upload(path,f);
      if(upErr)throw upErr;
      await sb.from("submissions").insert({progress_id:pid,type:"file",payload:{path,name:f.name}});
    }
    if(m.type==="scheduler"){
      await sb.from("submissions").insert({progress_id:pid,type:"booking",payload:{noted_at:new Date().toISOString()}});
    }
    // set status based on who has authority to complete
    const newStatus = m.completion_authority==="admin" ? "submitted" : "complete";
    const patch={status:newStatus};
    if(newStatus==="complete"){patch.completed_at=new Date().toISOString();patch.completed_by=ME.id;}
    await sb.from("progress").update(patch).eq("id",pid);
    // TODO Phase 2: trigger completion email here
    renderAgent();
  }catch(err){alert(err.message||"Could not save. Try again.");btn.disabled=false;btn.textContent=m.cta_label;}
}

/* ============================================================
   ADMIN SIDE
   ============================================================ */
let adminTab="modules";
async function renderAdmin(){
  const v=$("view");
  v.innerHTML=`<div class="pagehead">
      <span class="eyebrow">Admin console</span>
      <h1>Onboarding control</h1>
      <p>Build the steps agents work through, and track how far each person has gotten.</p>
    </div>
    <div class="tabs">
      <button class="tab ${adminTab==='modules'?'on':''}" onclick="setTab('modules')">Modules</button>
      <button class="tab ${adminTab==='progress'?'on':''}" onclick="setTab('progress')">Agent progress</button>
    </div>
    <div id="adminBody"><div class="empty">Loading…</div></div>`;
  adminTab==="modules" ? renderModulesAdmin() : renderProgressAdmin();
}
window.setTab=t=>{adminTab=t;renderAdmin();};

async function renderModulesAdmin(){
  const {data:modules}=await sb.from("modules").select("*").order("order_index");
  const b=$("adminBody");
  let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <span class="eyebrow">${(modules||[]).length} module(s)</span>
      <button class="btn sm" onclick="editModule()">+ New module</button></div>`;
  if(!modules||!modules.length){
    html+=`<div class="empty"><div class="big">No modules yet</div>Create your first onboarding step to get started.</div>`;
  }else{
    modules.forEach((m,i)=>{
      html+=`<div class="row">
        <span class="ord">${m.order_index}</span>
        <div class="rmain">
          <div class="rt">${esc(m.title)}
            ${!m.is_published?'<span class="badge draft">draft</span>':''}
            ${m.completion_authority==="admin"?'<span class="badge admin">admin-verified</span>':''}
            ${!m.is_blocking?'<span class="badge">non-blocking</span>':''}
          </div>
          <div class="rs">${TYPES[m.type]?.label||m.type}</div>
        </div>
        <div class="ractions">
          <button class="btn sm ghost" onclick="moveModule('${m.id}',-1)" ${i===0?'disabled':''}>↑</button>
          <button class="btn sm ghost" onclick="moveModule('${m.id}',1)" ${i===modules.length-1?'disabled':''}>↓</button>
          <button class="btn sm ghost" onclick="editModule('${m.id}')">Edit</button>
          <button class="btn sm danger" onclick="deleteModule('${m.id}','${esc(m.title)}')">Delete</button>
        </div></div>`;
    });
  }
  b.innerHTML=html;
}

window.moveModule=async(id,dir)=>{
  const {data:mods}=await sb.from("modules").select("id,order_index").order("order_index");
  const i=mods.findIndex(m=>m.id===id), j=i+dir;
  if(j<0||j>=mods.length)return;
  const a=mods[i],c=mods[j];
  await sb.from("modules").update({order_index:c.order_index}).eq("id",a.id);
  await sb.from("modules").update({order_index:a.order_index}).eq("id",c.id);
  renderModulesAdmin();
};
window.deleteModule=async(id,title)=>{
  if(!confirm(`Delete "${title}"? This removes it and any agent progress on it.`))return;
  await sb.from("modules").delete().eq("id",id);
  renderModulesAdmin();
};

/* ---- module editor modal ---- */
window.editModule=async(id)=>{
  let m={order_index:0,title:"",description:"",type:"mark_complete",content:{},cta_label:"",
         completion_authority:"self",is_blocking:true,is_published:true};
  if(id){const {data}=await sb.from("modules").select("*").eq("id",id).single();m=data;m.content=m.content||{};}
  else{const {data:mx}=await sb.from("modules").select("order_index").order("order_index",{ascending:false}).limit(1);
       m.order_index=(mx&&mx[0]?mx[0].order_index:0)+1;}
  $("modalTitle").textContent=id?"Edit module":"New module";
  $("modalBody").innerHTML=`
    <label class="field"><span class="lab">Step title</span><input id="m_title" value="${esc(m.title)}"></label>
    <label class="field"><span class="lab">Short description (shown on the dashboard)</span><input id="m_desc" value="${esc(m.description||'')}"></label>
    <label class="field"><span class="lab">Module type</span>
      <select id="m_type" onchange="renderTypeFields()">
        ${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${m.type===k?'selected':''}>${v.label}</option>`).join("")}
      </select></label>
    <div id="m_typeFields"></div>
    <label class="field"><span class="lab">Button label</span><input id="m_cta" value="${esc(m.cta_label||'')}" placeholder="Defaults to a sensible label"></label>
    <label class="field"><span class="lab">Who marks it complete?</span>
      <select id="m_auth">
        <option value="self" ${m.completion_authority==='self'?'selected':''}>The agent (self-serve)</option>
        <option value="admin" ${m.completion_authority==='admin'?'selected':''}>You (admin-verified)</option>
      </select></label>
    <div style="display:flex;gap:24px;margin:6px 0 22px">
      <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="m_block" ${m.is_blocking?'checked':''} style="width:auto"> Blocks the next step</label>
      <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="m_pub" ${m.is_published?'checked':''} style="width:auto"> Published (visible to agents)</label>
    </div>
    <div class="actionbar">
      <button class="btn" id="saveMod">${id?'Save changes':'Create module'}</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
    </div>`;
  window._editId=id; window._editContent=m.content;
  renderTypeFields();
  $("saveMod").onclick=()=>saveModule(id);
  openModal();
};
window.renderTypeFields=()=>{
  const t=$("m_type").value, fields=TYPES[t].fields, c=window._editContent||{};
  $("m_typeFields").innerHTML=fields.map(f=>{
    const val=esc(c[f]||"");
    if(f==="body_html")return `<label class="field"><span class="lab">${FIELD_LABELS[f]}</span><textarea id="f_${f}" rows="4">${val}</textarea></label>`;
    return `<label class="field"><span class="lab">${FIELD_LABELS[f]}</span><input id="f_${f}" value="${val}"></label>`;
  }).join("");
};
async function saveModule(id){
  const t=$("m_type").value;
  const content={};
  TYPES[t].fields.forEach(f=>{const el=$("f_"+f);if(el&&el.value.trim())content[f]=el.value.trim();});
  const rec={
    title:$("m_title").value.trim(), description:$("m_desc").value.trim(),
    type:t, content, cta_label:$("m_cta").value.trim()||null,
    completion_authority:$("m_auth").value, is_blocking:$("m_block").checked,
    is_published:$("m_pub").checked, updated_at:new Date().toISOString()
  };
  if(!rec.title){alert("Give the module a title.");return;}
  const btn=$("saveMod");btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  try{
    if(id){await sb.from("modules").update(rec).eq("id",id);}
    else{
      const {data:mx}=await sb.from("modules").select("order_index").order("order_index",{ascending:false}).limit(1);
      rec.order_index=(mx&&mx[0]?mx[0].order_index:0)+1;
      await sb.from("modules").insert(rec);
    }
    closeModal();renderModulesAdmin();
  }catch(err){alert(err.message);btn.disabled=false;btn.textContent="Save";}
}

/* ---- progress matrix ---- */
async function renderProgressAdmin(){
  const {data:agents}=await sb.from("profiles").select("*").eq("role","agent").order("full_name");
  const {data:modules}=await sb.from("modules").select("*").order("order_index");
  const {data:allProg}=await sb.from("progress").select("*");
  const b=$("adminBody");
  if(!agents||!agents.length){b.innerHTML=`<div class="empty"><div class="big">No agents yet</div>Agents appear here once they create an account.</div>`;return;}
  if(!modules||!modules.length){b.innerHTML=`<div class="empty"><div class="big">No modules yet</div>Create modules first, then track progress here.</div>`;return;}
  const key=(a,m)=>a+"|"+m;
  const pmap={}; (allProg||[]).forEach(p=>pmap[key(p.agent_id,p.module_id)]=p);
  let html='<div class="matrix"><table><thead><tr><th>Agent</th>';
  modules.forEach((m,i)=>html+=`<th title="${esc(m.title)}">${i+1}</th>`);
  html+='<th>Done</th></tr></thead><tbody>';
  agents.forEach(a=>{
    const doneCount=modules.filter(m=>pmap[key(a.id,m.id)]?.status==="complete").length;
    html+=`<tr><td><strong>${esc(a.full_name||a.email)}</strong><br><span class="rs mono" style="font-size:11px;color:var(--muted)">${esc(a.email)}</span></td>`;
    modules.forEach(m=>{
      const p=pmap[key(a.id,m.id)], st=p?.status;
      let cell='<span class="cell o">·</span>';
      if(st==="complete")cell='<span class="cell c">✓</span>';
      else if(st==="submitted")cell=`<span class="cell s" title="Awaiting your sign-off" style="cursor:pointer" onclick="confirmComplete('${p.id}','${esc(a.full_name||a.email)}','${esc(m.title)}')">!</span>`;
      html+=`<td>${cell}</td>`;
    });
    html+=`<td><strong>${doneCount}/${modules.length}</strong></td></tr>`;
  });
  html+='</tbody></table></div>'+
    `<p class="note" style="margin-top:14px">✓ complete · <span style="color:var(--warn)">!</span> submitted, awaiting your sign-off (click to confirm) · · not started</p>`;
  b.innerHTML=html;
}
window.confirmComplete=async(pid,agent,title)=>{
  if(!confirm(`Mark "${title}" complete for ${agent}?`))return;
  await sb.from("progress").update({status:"complete",completed_at:new Date().toISOString(),completed_by:ME.id}).eq("id",pid);
  // TODO Phase 2: trigger completion email here
  renderProgressAdmin();
};

/* ---- modal + utils ---- */
function openModal(){$("modal").classList.add("on");}
function closeModal(){$("modal").classList.remove("on");}
window.closeModal=closeModal;
$("modalClose").onclick=closeModal;
$("modal").onclick=e=>{if(e.target===$("modal"))closeModal();};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---- init ---- */
setMode("signin");
(async()=>{const {data:{session}}=await sb.auth.getSession();session?boot():showAuth();})();
</script>
