<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elevate Onboarding — Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">Elevate<b>.</b></div>
    <div style="display:flex; align-items:center; gap:16px;">
      <span class="who" id="who"></span>
      <button id="signout">Sign out</button>
    </div>
  </div>

  <div class="wrap">
    <div class="page-head">
      <span class="label">Your onboarding</span>
      <h1 id="greeting">Welcome.</h1>
      <p>Work through each step in order. Finish one to unlock the next.</p>
      <div class="meter">
        <span class="label" id="meter-label">0 of 0 complete</span>
        <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
      </div>
    </div>

    <div class="modules" id="modules"></div>
  </div>

  <!-- Module sub-page -->
  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    let ME = null;          // { user, profile }
    let MODULES = [];       // computed w/ _status, _progress

    document.getElementById("signout").addEventListener("click", signOut);

    async function init() {
      ME = await requireAuth();
      if (!ME) return;
      document.getElementById("who").textContent = (ME.profile?.full_name || ME.user.email);
      const first = (ME.profile?.full_name || "").split(" ")[0];
      document.getElementById("greeting").textContent = first ? `Welcome, ${first}.` : "Welcome.";
      await load();
    }

    async function load() {
      const { data: modules } = await sb.from("modules")
        .select("*").eq("is_published", true).order("order_index");
      const { data: progress } = await sb.from("progress")
        .select("*").eq("agent_id", ME.user.id);

      MODULES = computeStatuses(modules || [], progress || []);
      render();
    }

    function render() {
      const total = MODULES.length;
      const done = MODULES.filter(m => m._status === "complete").length;
      document.getElementById("meter-label").textContent = `${done} of ${total} complete`;
      document.getElementById("meter-fill").style.width = total ? `${(done/total)*100}%` : "0%";

      const list = document.getElementById("modules");
      list.innerHTML = "";
      MODULES.forEach((m, i) => {
        const locked = m._status === "locked";
        const el = document.createElement("button");
        el.className = "module" + (locked ? " is-locked" : "");
        el.innerHTML = `
          <span class="idx">${String(i + 1).padStart(2, "0")}</span>
          <span>
            <div class="m-title">${escapeHtml(m.title)}</div>
            <div class="m-sub">${escapeHtml(m.description || typeLabel(m.type))}</div>
          </span>
          <span class="pill ${m._status}">${statusText(m._status)}</span>`;
        el.addEventListener("click", () => { if (!locked) openModule(m); });
        list.appendChild(el);
      });
    }

    // ---------- Sub-page rendering by type ----------
    function openModule(m) {
      const sheet = document.getElementById("sheet");
      const c = m.content || {};
      let inner = `
        <span class="label">Step ${String(MODULES.indexOf(m)+1).padStart(2,"0")} · ${typeLabel(m.type)}</span>
        <h2>${escapeHtml(m.title)}</h2>
        <p class="desc">${escapeHtml(m.description || "")}</p>`;

      const alreadyDone = m._status === "complete";
      const awaiting = m._status === "submitted";

      if (m.type === "video") {
        inner += c.video_url ? `<iframe class="embed" src="${embedUrl(c.video_url)}" allowfullscreen></iframe>` : "";
        inner += completeButton(m, alreadyDone, "I've watched this");
      }
      else if (m.type === "link_submission") {
        inner += `<input class="field" id="link" type="url" placeholder="https://linktr.ee/yourname" ${alreadyDone?"disabled":""} />`;
        inner += alreadyDone ? doneMsg() : `<button class="btn" id="cta">Submit link</button>`;
      }
      else if (m.type === "scheduler") {
        const url = c.calendar_url || "";
        inner += url ? `<iframe class="cal" src="${url}"></iframe>` : `<p class="note">No booking link set yet.</p>`;
        inner += `<p class="note">Book a time above. Your coach marks this complete after your session.</p>`;
        inner += awaiting
          ? `<div class="row"><span class="pill submitted">Booked — waiting on your coach</span></div>`
          : (alreadyDone ? doneMsg() : `<button class="btn" id="cta">I've booked my session</button>`);
      }
      else if (m.type === "acknowledgment") {
        inner += `<div class="desc">${c.body_html || ""}</div>`;
        inner += completeButton(m, alreadyDone, "I acknowledge & agree");
      }
      else if (m.type === "file_upload") {
        inner += `<input class="field" id="file" type="file" ${alreadyDone?"disabled":""} />`;
        inner += alreadyDone ? doneMsg() : `<button class="btn" id="cta">Upload & complete</button>`;
      }
      else if (m.type === "embedded_academy") {
        inner += c.academy_url
          ? `<div class="row"><a class="btn" href="${c.academy_url}" target="_blank" rel="noopener">Open the Academy</a></div>`
          : "";
        inner += `<p class="note">Live scoring lands here in a later update.</p>`;
        inner += completeButton(m, alreadyDone, "I've finished the course");
      }
      else { // mark_complete
        inner += c.body_html ? `<div class="desc">${c.body_html}</div>` : "";
        inner += completeButton(m, alreadyDone, m.cta_label || "Mark as complete");
      }

      inner += `<div class="err" id="serr"></div>
        <div class="row" style="margin-top:18px;"><button class="btn ghost" id="closex">Close</button></div>`;
      sheet.innerHTML = inner;
      document.getElementById("overlay").classList.add("open");
      document.getElementById("closex").addEventListener("click", closeModule);

      const cta = document.getElementById("cta");
      if (cta) cta.addEventListener("click", () => handleCta(m));
    }

    function completeButton(m, done, labelIfActive) {
      return done ? doneMsg() : `<button class="btn" id="cta">${escapeHtml(labelIfActive)}</button>`;
    }
    function doneMsg() { return `<div class="row"><span class="pill complete">Completed</span></div>`; }

    async function handleCta(m) {
      const serr = document.getElementById("serr");
      serr.textContent = "";
      try {
        const prog = await ensureProgress(ME.user.id, m.id);

        if (m.type === "link_submission") {
          const url = document.getElementById("link").value.trim();
          if (!url) { serr.textContent = "Paste your link first."; return; }
          await saveSubmission(prog.id, "link", { url });
        }
        else if (m.type === "file_upload") {
          const f = document.getElementById("file").files[0];
          if (!f) { serr.textContent = "Choose a file first."; return; }
          const path = `${ME.user.id}/${m.id}/${Date.now()}_${f.name}`;
          const { error: upErr } = await sb.storage.from("submissions").upload(path, f);
          if (upErr) { serr.textContent = "Upload failed: " + upErr.message; return; }
          await saveSubmission(prog.id, "file", { path });
        }
        else if (m.type === "scheduler") {
          await saveSubmission(prog.id, "booking", { note: "Agent confirmed booking" });
        }

        // Admin-authority modules go to 'submitted'; everything else completes now.
        if (m.completion_authority === "admin") {
          await setProgressStatus(prog.id, "submitted");
        } else {
          await setProgressStatus(prog.id, "complete", ME.user.id);
        }

        closeModule();
        await load();
      } catch (e) {
        serr.textContent = "Something went wrong. Try again.";
        console.error(e);
      }
    }

    function closeModule() { document.getElementById("overlay").classList.remove("open"); }
    document.getElementById("overlay").addEventListener("click", e => {
      if (e.target.id === "overlay") closeModule();
    });

    // ---------- small utils ----------
    function statusText(s){return {available:"Start",complete:"Done",submitted:"Awaiting coach",locked:"Locked"}[s]||s;}
    function typeLabel(t){return {video:"Video",link_submission:"Submit a link",scheduler:"Book a session",
      acknowledgment:"Acknowledge",file_upload:"Upload a file",embedded_academy:"Academy course",mark_complete:"Task"}[t]||t;}
    function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function embedUrl(url){
      const yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]+)/);
      if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
      const vm = url.match(/vimeo\.com\/(\d+)/);
      if (vm) return `https://player.vimeo.com/video/${vm[1]}`;
      return url;
    }

    init();
  </script>
</body>
</html>
